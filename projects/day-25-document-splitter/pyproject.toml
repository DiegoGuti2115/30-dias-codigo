[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-splitter"
version = "0.1.0"
description = "CLI local para fragmentar documentos."
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
