<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Presentación interactiva de la API de análisis de texto: de un texto a métricas reproducibles.">
  <title>API de análisis de texto · Presentación</title>
  <style>
    :root { --ink:#eef7ff; --muted:#a9c1d7; --bg:#07111f; --panel:#0d1d31; --panel-2:#122943; --line:#254563; --python:#ffd343; --fastapi:#4de3b4; --data:#62c9ff; --violet:#bca7ff; --danger:#ff9aaa; --shadow:0 28px 80px rgba(0,0,0,.38); }
    * { box-sizing:border-box; }
    html { color-scheme:dark; }
    body { min-width:320px; margin:0; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 5% 3%,#163a57 0,transparent 29rem),radial-gradient(circle at 96% 96%,#30215e 0,transparent 36rem),var(--bg); }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,textarea:focus-visible { outline:3px solid var(--python); outline-offset:3px; }
    .shell { width:min(1200px,calc(100% - 2rem)); margin:auto; padding:1.5rem 0 2.5rem; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; }
    .brand { font-size:.92rem; font-weight:850; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }.brand b { color:var(--data); }
    .counter { font:700 .88rem ui-monospace,SFMono-Regular,Consolas,monospace; color:var(--muted); }
    .deck { overflow:hidden; border:1px solid var(--line); border-radius:28px; background:linear-gradient(135deg,rgba(18,41,67,.97),rgba(7,17,31,.98)); box-shadow:var(--shadow); }
    .track { display:flex; transition:transform .5s cubic-bezier(.2,.8,.2,1); }
    .slide { flex:0 0 100%; min-height:650px; padding:clamp(1.5rem,5vw,4.5rem); display:grid; grid-template-columns:minmax(0,1.02fr) minmax(330px,.98fr); align-items:center; gap:clamp(1.4rem,5vw,4.4rem); }
    .eyebrow { margin:0 0 .9rem; color:var(--data); font-size:.78rem; font-weight:850; letter-spacing:.14em; text-transform:uppercase; }
    h1,h2,h3,p { margin-top:0; } h1,h2 { margin-bottom:1.15rem; letter-spacing:-.055em; line-height:.98; } h1 { max-width:10ch; font-size:clamp(3rem,7vw,6.25rem); } h2 { max-width:12ch; font-size:clamp(2.4rem,5vw,4.6rem); } h3 { margin-bottom:.3rem; font-size:1rem; }
    .lead { max-width:54ch; color:var(--muted); font-size:clamp(1.02rem,1.8vw,1.25rem); line-height:1.62; }
    .badge,.chip { display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--line); border-radius:999px; padding:.42rem .72rem; background:rgba(98,201,255,.08); color:var(--data); font:750 .8rem ui-monospace,SFMono-Regular,Consolas,monospace; }
    .badge { margin-top:.35rem; }.chip.green { color:var(--fastapi); background:rgba(77,227,180,.08); }.chip.yellow { color:var(--python); background:rgba(255,211,67,.09); }
    .visual { min-width:0; padding:clamp(1rem,2vw,1.4rem); border:1px solid var(--line); border-radius:22px; background:rgba(2,11,23,.48); box-shadow:0 14px 34px rgba(0,0,0,.18); }
    .code { overflow:auto; margin:0; padding:1.1rem; border:1px solid #1a334d; border-radius:16px; background:#06101c; color:#d9eeff; font:.82rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; }.key { color:var(--data); }.value { color:var(--fastapi); }.number { color:var(--python); }.muted { color:var(--muted); }
    .transform { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.7rem; }.document,.result { min-width:0; padding:1rem; border:1px solid var(--line); border-radius:15px; background:rgba(255,255,255,.035); }.document { border-top:3px solid var(--python); }.result { border-top:3px solid var(--fastapi); }.document p,.result p { margin:0; }.arrow { color:var(--data); font-size:1.75rem; font-weight:900; }
    .endpoint { margin-top:1rem; padding:.85rem 1rem; border-radius:14px; background:rgba(98,201,255,.1); color:var(--data); font:800 .9rem ui-monospace,SFMono-Regular,Consolas,monospace; }
    .endpoint b { color:var(--fastapi); }.micro { color:var(--muted); font-size:.85rem; line-height:1.5; }
    .flow { display:grid; gap:.55rem; }.flow-step { width:100%; display:grid; grid-template-columns:2rem 1fr auto; align-items:center; gap:.75rem; padding:.85rem .9rem; border:1px solid var(--line); border-radius:14px; text-align:left; color:var(--ink); background:rgba(255,255,255,.035); }.flow-step:hover,.flow-step[aria-pressed="true"] { background:rgba(98,201,255,.11); border-color:var(--data); }.flow-step b { display:grid; place-items:center; width:2rem; height:2rem; border-radius:50%; color:#06101c; background:var(--data); }.flow-step small { color:var(--muted); }.flow-step span:last-child { color:var(--data); font-size:1.15rem; }.detail { min-height:116px; margin-top:.75rem; padding:1rem; border-left:4px solid var(--violet); border-radius:12px; background:rgba(188,167,255,.1); color:#ded6ff; line-height:1.55; }.detail b { color:var(--ink); }
    .guarantees { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.7rem; }.guarantee { padding:1rem; border:1px solid var(--line); border-radius:15px; background:rgba(255,255,255,.035); }.guarantee:hover { transform:translateY(-2px); border-color:var(--fastapi); }.guarantee p { margin:0; color:var(--muted); font-size:.88rem; line-height:1.48; }.icon { display:inline-grid; place-items:center; width:2rem; height:2rem; margin-bottom:.65rem; border-radius:10px; background:rgba(77,227,180,.12); color:var(--fastapi); font-weight:900; }
    .evidence { display:grid; grid-template-columns:repeat(3,1fr); gap:.65rem; }.metric { padding:1rem; border:1px solid var(--line); border-radius:15px; background:rgba(255,255,255,.035); }.metric b { display:block; margin-bottom:.18rem; color:var(--fastapi); font-size:clamp(1.45rem,3vw,2.2rem); letter-spacing:-.06em; }.metric span { color:var(--muted); font-size:.82rem; }.limits { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1rem; }.limit { padding:.42rem .62rem; border-radius:10px; background:rgba(255,211,67,.1); color:#ffe7a1; font-size:.8rem; }
    .demo { margin-top:1rem; }.demo label { display:block; margin-bottom:.5rem; color:var(--muted); font-size:.86rem; font-weight:700; }.demo textarea { display:block; width:100%; min-height:72px; resize:vertical; padding:.75rem; border:1px solid var(--line); border-radius:12px; color:var(--ink); background:#071321; line-height:1.45; }.demo-row { display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin:.65rem 0; }.demo button { padding:.58rem .78rem; border:1px solid rgba(77,227,180,.58); border-radius:10px; color:#051511; background:var(--fastapi); font-weight:850; }.demo button:hover { filter:brightness(1.08); }.count { color:var(--muted); font:700 .78rem ui-monospace,SFMono-Regular,Consolas,monospace; }.demo-output { min-height:88px; font-size:.72rem; }.demo-error { color:var(--danger); font-size:.84rem; font-weight:700; }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1rem; border-top:1px solid var(--line); background:rgba(0,7,16,.34); }.nav-button { min-height:2.7rem; padding:.55rem .9rem; border:1px solid var(--line); border-radius:12px; color:var(--ink); background:var(--panel); font-weight:800; }.nav-button:hover:not(:disabled) { border-color:var(--data); background:var(--panel-2); }.nav-button:disabled { cursor:not-allowed; opacity:.42; }.dots { display:flex; justify-content:center; gap:.45rem; }.dot { width:.7rem; min-height:.7rem; padding:0; border:1px solid transparent; border-radius:99px; background:#48617a; }.dot[aria-current="true"] { width:1.8rem; background:var(--data); }.dot:hover { background:var(--python); }
    .footer { padding:1.1rem 0 0; color:var(--muted); text-align:center; font-size:.86rem; }.footer b { color:var(--data); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:800px) { .slide { min-height:710px; grid-template-columns:1fr; }.slide > :first-child { align-self:end; }.slide > .visual { align-self:start; } h1,h2 { max-width:14ch; } }
    @media (max-width:520px) { .shell { width:min(100% - 1rem,1200px); padding-top:.75rem; }.topbar { align-items:flex-start; }.slide { min-height:755px; padding:1.45rem; }.transform { grid-template-columns:1fr; }.arrow { transform:rotate(90deg); text-align:center; }.guarantees { grid-template-columns:1fr; }.evidence { grid-template-columns:1fr; }.controls { flex-wrap:wrap; }.dots { order:-1; width:100%; }.nav-button { flex:1; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } .guarantee:hover { transform:none; } }
  </style>
</head>
<body>
  <main class="shell" aria-labelledby="presentation-title">
    <header class="topbar">
      <div class="brand">Día 11 <b>/</b> 30 días, 30 proyectos</div>
      <div id="counter" class="counter" aria-live="polite">Diapositiva 1 de 5</div>
    </header>
    <section class="deck" aria-roledescription="carrusel" aria-label="Presentación API de análisis de texto">
      <div id="track" class="track"></div>
      <div class="controls" aria-label="Controles de la presentación">
        <button id="previous" class="nav-button" type="button" aria-label="Ir a la diapositiva anterior">← Anterior</button>
        <div id="dots" class="dots" role="tablist" aria-label="Seleccionar diapositiva"></div>
        <button id="next" class="nav-button" type="button" aria-label="Ir a la diapositiva siguiente">Siguiente →</button>
      </div>
    </section>
    <p id="announcement" class="sr-only" aria-live="polite"></p>
    <footer class="footer">Contenido basado en el contrato v1, implementación, fixtures y pruebas de la <b>API de análisis de texto</b>.</footer>
  </main>
  <script>
    const presentation = [
      { id:'portada', label:'Portada', kicker:'Versión 1 · API local y determinista', title:'API de análisis de texto: de un texto a métricas reproducibles', subtitle:'Python + FastAPI + Pydantic', lead:'Un texto entra. Una respuesta JSON estructurada sale. Entre ambos: validación estricta, reglas explícitas y cálculos sin estado.', view:'cover' },
      { id:'alcance', label:'Problema y alcance', kicker:'01 · Un problema, una operación', title:'Entra un texto. Salen métricas, frecuencias y palabras clave.', lead:'La versión 1 concentra el alcance en una única operación HTTP y convierte texto proporcionado por el cliente en un resumen cuantitativo interpretable.', view:'scope' },
      { id:'arquitectura', label:'Flujo técnico', kicker:'02 · Responsabilidades separadas', title:'De la solicitud a una respuesta verificable.', lead:'La capa HTTP valida y delega. El núcleo calcula; la respuesta se serializa según el contrato. Explora cada etapa del flujo.', view:'architecture' },
      { id:'garantias', label:'Garantías de diseño', kicker:'03 · Calidad por diseño', title:'Reglas visibles para resultados previsibles.', lead:'Cada decisión está documentada y favorece reproducibilidad, compatibilidad y pruebas aisladas.', view:'quality' },
      { id:'evidencia', label:'Evidencia y cierre', kicker:'04 · Lista para revisar', title:'Una entrega pequeña, trazable y demostrable.', lead:'El proyecto reúne contrato, fixture, guía de ejecución y una suite automatizada para sostener una v1 de alcance intencionadamente acotado.', view:'evidence' }
    ];

    const track = document.querySelector('#track');
    const dots = document.querySelector('#dots');
    const counter = document.querySelector('#counter');
    const announcement = document.querySelector('#announcement');
    const previous = document.querySelector('#previous');
    const next = document.querySelector('#next');
    let current = 0;
    let touchStartX = null;

    function codeBlock(content) { return `<pre class="code">${content}</pre>`; }
    function guarantee(icon, title, text) { return `<article class="guarantee"><span class="icon" aria-hidden="true">${icon}</span><h3>${title}</h3><p>${text}</p></article>`; }
    function slideView(slide) {
      if (slide.view === 'cover') return `<div class="visual"><div class="transform" aria-label="Transformación de texto a JSON"><div class="document"><span class="chip yellow">Entrada</span><p style="margin-top:.75rem">La API analiza texto.<br>La API devuelve métricas útiles.</p></div><div class="arrow" aria-hidden="true">→</div><div class="result"><span class="chip green">Respuesta JSON</span><p style="margin-top:.75rem"><b>metrics</b> · frecuencias<br><b>keywords</b> · reglas estables</p></div></div><div class="endpoint"><b>POST</b> /api/v1/analyze</div><p class="micro" style="margin:1rem 0 0">JSON UTF-8 · solicitud estricta · procesamiento local · sin persistencia</p></div>`;
      if (slide.view === 'scope') return `<div class="visual">${codeBlock(`{\n  <span class="key">"text"</span>: <span class="value">"La API analiza texto."</span>\n}\n\n<span class="muted">200 OK</span>\n{\n  <span class="key">"metrics"</span>: { <span class="key">"word_count"</span>: <span class="number">4</span>, ... },\n  <span class="key">"word_frequencies"</span>: [{ <span class="key">"word"</span>: <span class="value">"api"</span>, <span class="key">"count"</span>: <span class="number">1</span> }],\n  <span class="key">"keywords"</span>: [{ <span class="key">"word"</span>: <span class="value">"api"</span>, <span class="key">"count"</span>: <span class="number">1</span> }]\n}`)}<div class="limits"><span class="limit">1–10.000 caracteres Unicode</span><span class="limit">Solo application/json</span><span class="limit">Hasta 5 keywords</span></div></div>`;
      if (slide.view === 'architecture') return `<div class="visual"><div id="flow" class="flow" aria-label="Diagrama técnico interactivo"></div><div id="flow-detail" class="detail" role="status"><b>Cliente HTTP</b><br>Envía una solicitud JSON UTF-8 a la única operación pública.</div></div>`;
      if (slide.view === 'quality') return `<div class="visual"><div class="guarantees">${guarantee('↗','Contrato antes de código','La ruta, los campos, límites y errores se fijan públicamente antes de implementar.')}${guarantee('NFC','Unicode NFC','Las palabras se normalizan en NFC y minúsculas Unicode; los diacríticos se conservan.')}${guarantee('≡','Orden estable','Frecuencias por recuento descendente y, en empate, palabra ascendente.')}${guarantee('10k','Límite de entrada','text admite de 1 a 10.000 caracteres Unicode; lo inválido se rechaza antes del análisis.')}${guarantee('{ }','Errores JSON','400, 415, 422, 405 y 500 comparten una envoltura pública de error.')}${guarantee('∅','Sin estado ni red','No persiste textos, no usa servicios externos y cada solicitud se analiza de forma independiente.')}</div></div>`;
      return `<div class="visual"><div class="evidence"><div class="metric"><b>50</b><span>pruebas superadas</span></div><div class="metric"><b>1</b><span>fixture versionado</span></div><div class="metric"><b>v1</b><span>guía reproducible</span></div></div><div class="demo"><label for="demo-text">Prueba local de la transformación documentada</label><textarea id="demo-text" maxlength="10000">La API analiza texto. La API devuelve métricas útiles.</textarea><div class="demo-row"><span id="demo-count" class="count">54 / 10.000 caracteres</span><button id="demo-run" type="button">Analizar localmente</button></div><div id="demo-error" class="demo-error" role="alert"></div>${codeBlock('<span id="demo-output" class="demo-output">Pulsa “Analizar localmente” para ver una representación del contrato.</span>')}<div class="limits"><span class="limit">Un único endpoint</span><span class="limit">Sin persistencia</span><span class="limit">Sin autenticación</span><span class="limit">Sin análisis semántico ni detección de idioma</span></div><p class="micro" style="margin:1rem 0 0"><b style="color:var(--data)">Repositorio en el primer comentario / enlace</b><br>Revisa el contrato, el fixture y la guía de reproducción.</p></div></div>`;
    }
    function renderSlides() { track.innerHTML = presentation.map((slide, index) => `<article class="slide" id="slide-${index}" role="tabpanel" aria-roledescription="diapositiva" aria-label="${slide.label}" aria-hidden="${index !== 0}"><div><p class="eyebrow">${slide.kicker}</p><h${index === 0 ? '1 id="presentation-title"' : '2'}>${slide.title}</h${index === 0 ? '1' : '2'}>${slide.subtitle ? `<p class="badge">${slide.subtitle}</p>` : ''}<p class="lead">${slide.lead}</p>${index === 0 ? '<span class="badge">Contrato público · v1</span>' : ''}</div>${slideView(slide)}</article>`).join(''); }
    function setFlow() {
      const steps = [
        ['Cliente HTTP','Envía un cuerpo JSON UTF-8 a <code>POST /api/v1/analyze</code>.', '01'],
        ['Validación Pydantic','<code>AnalyzeRequest</code> exige exactamente <code>text</code>, una cadena de 1 a 10.000 caracteres.', '02'],
        ['Núcleo determinista','<code>analyze_text</code> coordina tokenización, métricas, frecuencias y palabras clave sin efectos secundarios.', '03'],
        ['Respuesta JSON','<code>AnalyzeResponse</code> serializa métricas, <code>word_frequencies</code> y <code>keywords</code>; los errores usan una envoltura estable.', '04']
      ];
      const flow = document.querySelector('#flow'); if (!flow) return;
      flow.innerHTML = steps.map((item, index) => `<button class="flow-step" type="button" data-flow="${index}" aria-pressed="${index === 0}"><b>${item[2]}</b><span>${item[0]}<small>${index < 3 ? ' → siguiente etapa' : ' → resultado'}</small></span><span aria-hidden="true">›</span></button>`).join('');
      const detail = document.querySelector('#flow-detail');
      flow.addEventListener('click', event => { const button = event.target.closest('[data-flow]'); if (!button) return; const index = Number(button.dataset.flow); flow.querySelectorAll('button').forEach((node, i) => node.setAttribute('aria-pressed', String(i === index))); detail.innerHTML = `<b>${steps[index][0]}</b><br>${steps[index][1]}`; });
    }
    function words(text) { return [...text.normalize('NFC').toLowerCase()].join('').match(/[\p{L}\p{N}]+/gu) || []; }
    function sentences(text) { return text.split(/[.!?…\n\r]+/u).filter(part => words(part).length).length; }
    function paragraphs(text) { return text.split(/(?:\r?\n)[\t \f\v\r]*(?:\r?\n)+/u).filter(part => words(part).length).length; }
    function analyzeLocal(text) {
      const normalized = words(text), counts = new Map(); normalized.forEach(word => counts.set(word, (counts.get(word) || 0) + 1));
      const frequencies = [...counts].sort((a,b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)).map(([word,count]) => ({word,count}));
      const stopwords = new Set(['a','al','and','de','del','el','en','es','for','in','la','las','los','of','or','para','por','the','to','un','una','y']);
      return { metrics:{ character_count:[...text].length, character_count_without_whitespace:[...text].filter(character => !/\s/u.test(character)).length, word_count:normalized.length, sentence_count:sentences(text), paragraph_count:paragraphs(text), estimated_reading_time_seconds:normalized.length ? Math.ceil(normalized.length / 200 * 60) : 0 }, word_frequencies:frequencies, keywords:frequencies.filter(item => !stopwords.has(item.word)).slice(0,5) };
    }
    function setDemo() {
      const input = document.querySelector('#demo-text'); if (!input) return;
      const count = document.querySelector('#demo-count'), output = document.querySelector('#demo-output'), error = document.querySelector('#demo-error'), run = document.querySelector('#demo-run');
      const characterCount = () => [...input.value].length;
      const updateCount = () => count.textContent = `${characterCount().toLocaleString('es-ES')} / 10.000 caracteres`;
      input.addEventListener('input', updateCount); updateCount();
      run.addEventListener('click', () => { error.textContent = ''; if (!characterCount()) { output.textContent = ''; error.textContent = 'validation_error · text debe contener al menos 1 carácter.'; return; } if (characterCount() > 10000) { output.textContent = ''; error.textContent = 'validation_error · text no puede superar 10.000 caracteres.'; return; } output.textContent = JSON.stringify(analyzeLocal(input.value), null, 2); });
    }
    function buildDots() { dots.innerHTML = ''; presentation.forEach((slide, index) => { const dot = document.createElement('button'); dot.type = 'button'; dot.className = 'dot'; dot.setAttribute('role','tab'); dot.setAttribute('aria-label',`Ir a la diapositiva ${index + 1}: ${slide.label}`); dot.addEventListener('click', () => show(index, true)); dots.append(dot); }); }
    function show(index, announce = false) { current = Math.max(0, Math.min(index, presentation.length - 1)); track.style.transform = `translateX(-${current * 100}%)`; [...track.children].forEach((slide, i) => slide.setAttribute('aria-hidden',String(i !== current))); [...dots.children].forEach((dot, i) => { dot.setAttribute('aria-current',String(i === current)); dot.setAttribute('aria-selected',String(i === current)); }); previous.disabled = current === 0; next.disabled = current === presentation.length - 1; counter.textContent = `Diapositiva ${current + 1} de ${presentation.length}`; if (announce) announcement.textContent = `${counter.textContent}: ${presentation[current].label}`; if (presentation[current].view === 'architecture') setFlow(); if (presentation[current].view === 'evidence') setDemo(); }
    renderSlides(); buildDots(); show(0);
    previous.addEventListener('click', () => show(current - 1, true)); next.addEventListener('click', () => show(current + 1, true));
    document.addEventListener('keydown', event => { if (event.target.matches('textarea,input,button')) return; if (event.key === 'ArrowLeft') show(current - 1, true); if (event.key === 'ArrowRight') show(current + 1, true); if (event.key === 'Home') show(0, true); if (event.key === 'End') show(presentation.length - 1, true); });
    track.addEventListener('touchstart', event => { touchStartX = event.changedTouches[0].screenX; }, {passive:true});
    track.addEventListener('touchend', event => { if (touchStartX === null) return; const delta = event.changedTouches[0].screenX - touchStartX; if (Math.abs(delta) > 42) show(current + (delta < 0 ? 1 : -1), true); touchStartX = null; }, {passive:true});
  </script>
</body>
</html>
